services:
  patroni1:
    build: .
    container_name: patroni1
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni1
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.1:18008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.1:15432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni1-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.1:15432:5432"
      - "10.100.0.1:18008:8008"
  patroni2:
    build: .
    container_name: patroni2
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni2
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.1:18009
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.1:15433
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni2-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.1:15433:5432"
      - "10.100.0.1:18009:8008"
  patroni3:
    build: .
    container_name: patroni3
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni3
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.1:18010
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.1:15434
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni3-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.1:15434:5432"
      - "10.100.0.1:18010:8008"

volumes:
  patroni1-data:
  patroni2-data:
  patroni3-data:
