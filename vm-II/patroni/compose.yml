services:
  patroni4:
    build: .
    container_name: patroni4
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni4
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.2:18008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.2:15432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni4-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.2:15432:5432"
      - "10.100.0.2:18008:8008"
  patroni5:
    build: .
    container_name: patroni5
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni5
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.2:18009
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.2:15433
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni5-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.2:15433:5432"
      - "10.100.0.2:18009:8008"
  patroni6:
    build: .
    container_name: patroni6
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni6
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.2:18010
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.2:15434
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni6-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.2:15434:5432"
      - "10.100.0.2:18010:8008"

volumes:
  patroni4-data:
  patroni5-data:
  patroni6-data:
