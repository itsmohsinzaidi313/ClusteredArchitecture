services:
  patroni7:
    build: .
    container_name: patroni7
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni7
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.3:18008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.3:15432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni7-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.3:15432:5432"
      - "10.100.0.3:18008:8008"
  patroni8:
    build: .
    container_name: patroni8
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni8
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.3:18009
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.3:15433
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni8-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.3:15433:5432"
      - "10.100.0.3:18009:8008"
  patroni9:
    build: .
    container_name: patroni9
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: postgres-cluster
      PATRONI_NAME: patroni9
      PATRONI_ETCD3_HOSTS: 10.100.0.1:2379,10.100.0.2:2379,10.100.0.3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.100.0.3:18010
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.100.0.3:15434
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in patroni/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in patroni/.env}
      PATRONI_REPLICATION_USERNAME: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_USERNAME in patroni/.env}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD:?Set PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD in patroni/.env}
    volumes:
      - patroni9-data:/var/lib/postgresql/data
    ports:
      - "10.100.0.3:15434:5432"
      - "10.100.0.3:18010:8008"

volumes:
  patroni7-data:
  patroni8-data:
  patroni9-data:
